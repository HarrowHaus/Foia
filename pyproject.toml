[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-record-inference-lab"
version = "0.1.0"
description = "Provenance-first tooling for novel inference across public records"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Public-Record Inference Lab"}]
dependencies = [
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9"
]

[project.optional-dependencies]
analysis = [
  "networkx>=3.2",
  "rapidfuzz>=3.9"
]
ocr = [
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "Pillow>=10.0"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.11",
  "build>=1.2"
]

[project.scripts]
pril = "pril.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
